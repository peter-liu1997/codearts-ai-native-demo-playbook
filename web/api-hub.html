<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>API Hub</title><link rel="stylesheet" href="/assets/styles.css">
<style>
  body.dark{--canvas:#0d1421;--surface:#151e2e;--ink:#eef4ff;--muted:#9aabc5;--line:#2a3850;color-scheme:dark}.api-shell{display:grid;grid-template-columns:300px 1fr;gap:16px}.api-tree{display:grid;gap:8px}.endpoint{width:100%;display:grid;grid-template-columns:58px 1fr;gap:8px;text-align:left;padding:10px;border:0;border-radius:9px;background:transparent;color:var(--ink)}.endpoint:hover,.endpoint.active{background:#edf4ff}.dark .endpoint:hover,.dark .endpoint.active{background:#23314a}.method{font-size:.72rem;font-weight:850}.GET{color:#15803d}.POST{color:#1265cc}.PUT{color:#b45309}.DELETE{color:#b91c1c}.tabs{display:flex;gap:8px;margin-bottom:14px}.tab.active{color:#fff;background:var(--accent)}.kv{display:grid;grid-template-columns:1fr 1fr 44px;gap:8px;margin-bottom:8px}.mock-row{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}.spinner{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.45);border-top-color:#fff;border-radius:50%;animation:spin .65s linear infinite}@keyframes spin{to{transform:rotate(1turn)}}@media(max-width:768px){.api-shell{grid-template-columns:1fr}.sidebar{display:none}.sidebar.open{display:block}}
</style></head>
<body><header class="topbar"><a class="brand" href="/"><span class="brand-mark"></span>API Hub</a><div style="flex:1;max-width:480px"><input id="search" placeholder="搜索接口名称" aria-label="搜索接口"></div><div class="top-actions"><button id="menu">目录</button><button id="export">导出</button><label style="display:inline"><input id="import" type="file" accept="application/json" hidden><span class="btn">导入</span></label><button id="theme">深色</button></div></header>
<main class="shell"><div class="tabs"><button class="btn tab active" data-tab="docs">接口文档</button><button class="btn tab" data-tab="mocks">Mock 服务</button></div>
<section class="api-shell" id="docs"><aside class="card sidebar"><h2>接口目录</h2><div class="api-tree" id="tree"></div></aside><article class="card"><div id="detail"></div><hr style="border:0;border-top:1px solid var(--line);margin:22px 0"><h2>在线调试</h2><div id="params"></div><button class="btn btn-ghost" id="add-param">+ 参数</button><button class="btn btn-primary" id="send" style="margin-left:8px">发送请求</button><pre id="response">点击“发送请求”查看 Mock 响应</pre></article></section>
<section class="card" id="mocks" hidden><h2>Mock 地址列表</h2><p class="muted">编辑内容会保存到 localStorage，刷新后仍保留。</p><div id="mock-list"></div></section></main>
<div class="modal" id="editor"><div class="modal-panel"><h2>编辑 Mock JSON</h2><textarea id="json-editor" rows="14"></textarea><p id="json-error" class="status status-bad" hidden></p><div class="form-actions"><button class="btn btn-primary" id="save-mock">保存</button><button class="btn" id="close-editor">取消</button></div></div></div>
<script src="/assets/common.js"></script><script>
const defaults=[{group:'用户管理',name:'查询用户列表',method:'GET',url:'/api/users',mock:{items:[{id:1,name:'张明'}],total:1}},{group:'用户管理',name:'创建用户',method:'POST',url:'/api/users',mock:{id:2,name:'新用户'}},{group:'用户管理',name:'删除用户',method:'DELETE',url:'/api/users/1',mock:{deleted:true}},{group:'订单管理',name:'查询订单',method:'GET',url:'/api/orders',mock:{items:[{id:'ORD-001',status:'PAID'}],total:1}},{group:'订单管理',name:'创建订单',method:'POST',url:'/api/orders',mock:{id:'ORD-002',status:'CREATED'}},{group:'订单管理',name:'更新订单',method:'PUT',url:'/api/orders/1',mock:{id:'ORD-001',status:'SHIPPED'}}];
let endpoints=JSON.parse(localStorage.getItem('api-hub-config')||'null')||defaults,current=0,editing=-1;
function save(){localStorage.setItem('api-hub-config',JSON.stringify(endpoints))}
function renderTree(filter=''){const rows=endpoints.map((x,i)=>({...x,i})).filter(x=>x.name.includes(filter));qs('#tree').innerHTML=rows.map(x=>`<button class="endpoint ${x.i===current?'active':''}" data-index="${x.i}"><span class="method ${x.method}">${x.method}</span><span>${escapeHtml(x.name)}</span></button>`).join('');qsa('[data-index]').forEach(b=>b.onclick=()=>{current=Number(b.dataset.index);renderTree(qs('#search').value);renderDetail()})}
function renderDetail(){const x=endpoints[current];qs('#detail').innerHTML=`<span class="status ${x.method==='GET'?'status-good':'status-warn'}">${x.method}</span><h1 style="font-size:1.7rem;color:var(--ink);margin-top:12px">${escapeHtml(x.name)}</h1><pre>${escapeHtml(x.url)}</pre><p class="muted">标准 JSON 响应 · 团队可直接复制到联调环境</p>`}
function addParam(){const row=document.createElement('div');row.className='kv';row.innerHTML='<input placeholder="Key"><input placeholder="Value"><button class="btn">×</button>';row.lastElementChild.onclick=()=>row.remove();qs('#params').appendChild(row)}
function renderMocks(){qs('#mock-list').innerHTML=endpoints.map((x,i)=>`<div class="mock-row"><code>/mock${escapeHtml(x.url)}</code><button class="btn btn-ghost" data-copy="${i}">复制</button><button class="btn" data-edit="${i}">编辑 Mock</button></div>`).join('');qsa('[data-copy]').forEach(b=>b.onclick=()=>{navigator.clipboard?.writeText(`/mock${endpoints[b.dataset.copy].url}`);toast('已复制')});qsa('[data-edit]').forEach(b=>b.onclick=()=>{editing=Number(b.dataset.edit);qs('#json-editor').value=JSON.stringify(endpoints[editing].mock,null,2);qs('#json-error').hidden=true;qs('#editor').classList.add('open')})}
qsa('[data-tab]').forEach(b=>b.onclick=()=>{qsa('[data-tab]').forEach(x=>x.classList.remove('active'));b.classList.add('active');qs('#docs').hidden=b.dataset.tab!=='docs';qs('#mocks').hidden=b.dataset.tab!=='mocks';renderMocks()});qs('#search').oninput=e=>renderTree(e.target.value);qs('#add-param').onclick=addParam;qs('#send').onclick=()=>{const b=qs('#send');b.innerHTML='<span class="spinner"></span> 请求中';setTimeout(()=>{const elapsed=Math.floor(50+Math.random()*250);qs('#response').textContent=JSON.stringify({status:200,elapsedMs:elapsed,data:endpoints[current].mock},null,2);b.textContent='发送请求'},elapsed)};qs('#theme').onclick=()=>{document.body.classList.toggle('dark');qs('#theme').textContent=document.body.classList.contains('dark')?'浅色':'深色'};qs('#menu').onclick=()=>qs('.sidebar').classList.toggle('open');qs('#close-editor').onclick=()=>qs('#editor').classList.remove('open');qs('#save-mock').onclick=()=>{try{endpoints[editing].mock=JSON.parse(qs('#json-editor').value);save();qs('#editor').classList.remove('open');toast('Mock 已保存')}catch(e){qs('#json-error').hidden=false;qs('#json-error').textContent='非法 JSON：'+e.message}};qs('#export').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(endpoints,null,2)],{type:'application/json'}));a.download='api-hub-config.json';a.click();URL.revokeObjectURL(a.href)};qs('#import').onchange=async e=>{try{const value=JSON.parse(await e.target.files[0].text());if(!Array.isArray(value))throw new Error('配置必须是数组');endpoints=value;save();current=0;renderTree();renderDetail();toast('配置导入成功')}catch(err){toast(err.message)}};renderTree();renderDetail();addParam();
</script></body></html>
