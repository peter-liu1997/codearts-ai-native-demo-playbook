<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SaaS 产品分析</title><link rel="stylesheet" href="/assets/styles.css">
<style>
  .metric-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.metric{padding:16px;border:1px solid var(--line);border-radius:13px;background:#fff;transition:.15s}.metric.selected{border-color:var(--accent);box-shadow:0 10px 25px rgba(19,102,214,.18)}.metric strong{display:block;font-size:1.5rem}.trend{color:var(--green);font-size:.82rem}.chart{width:100%;height:260px}.chart line{stroke:#dbe2ed}.chart text{fill:#718096;font-size:11px}.line-a{fill:none;stroke:#1366d6;stroke-width:3}.line-b{fill:none;stroke:#13a77b;stroke-width:3}.line-c{fill:none;stroke:#dc6b2f;stroke-width:3}.area{fill:rgba(19,102,214,.06)}.dashboard-charts{display:grid;grid-template-columns:2fr 1fr;gap:16px}.feature-row:hover{box-shadow:inset 2px 0 var(--accent);background:#f8fbff}.collapse{display:none}@media(max-width:900px){.metric-grid{grid-template-columns:repeat(2,1fr)}.dashboard-charts{grid-template-columns:1fr}}
</style></head>
<body><header class="topbar"><a class="brand" href="/"><span class="brand-mark"></span>SaaS 产品分析</a><div class="top-actions"><button id="compare">昨日 / 今日</button><a href="/">案例门户</a></div></header>
<main class="shell"><div class="section-title"><div><h1 style="font-size:2rem;color:var(--ink)">产品分析</h1><p style="color:var(--muted)">2026 年 7 月 4 日 - 8 月 2 日 · 设计规范驱动的第四轮迭代</p></div><div class="filters" style="margin:0"><button class="filter-chip">7 天</button><button class="filter-chip">14 天</button><button class="filter-chip active">30 天</button><button class="filter-chip">自定义</button></div></div>
<section class="metric-grid" id="metrics"></section>
<section class="dashboard-charts" style="margin-top:16px">
<article class="card"><h2>用户增长趋势</h2><p class="muted">左轴用户与会话，右轴收入</p><svg class="chart" viewBox="0 0 700 260" role="img" aria-label="用户增长双轴趋势图"><line x1="40" y1="220" x2="660" y2="220"/><line x1="40" y1="60" x2="660" y2="60"/><path class="area" d="M40 200 C160 170,180 180,260 135 S420 115,500 80 S600 70,660 50 L660 220 L40 220Z"/><path class="line-a" d="M40 200 C160 170,180 180,260 135 S420 115,500 80 S600 70,660 50"/><path class="line-b" d="M40 210 C150 205,190 160,280 170 S430 110,520 120 S610 75,660 88"/><path class="line-c" d="M40 185 C130 165,220 190,300 150 S460 105,550 100 S620 65,660 55"/><text x="44" y="248">7/04</text><text x="610" y="248">8/02</text></svg><div class="case-meta"><span class="tag">活跃用户</span><span class="tag">会话数</span><span class="tag tag-red">收入趋势</span></div></article>
<article class="card"><h2>用户留存曲线</h2><p class="status status-good">高于行业基准</p><svg class="chart" viewBox="0 0 320 260"><line x1="25" y1="180" x2="300" y2="180" stroke-dasharray="6 5"/><text x="190" y="173">行业基准 30%</text><path class="line-a" d="M25 60 C80 90,100 105,150 125 S230 150,300 165"/></svg></article>
  </section>
  <section class="card" style="margin-top:16px"><div class="section-title" style="margin:0 0 10px"><div><h2>功能使用排行</h2><p>默认折叠以降低首屏密度</p></div><button class="btn btn-ghost" id="toggle-table">展开明细</button></div><div id="table-wrap" class="collapse"><table><thead><tr><th>排名</th><th>功能</th><th>DAU</th><th>增长</th><th>状态</th></tr></thead><tbody><tr class="feature-row"><td>1</td><td>智能问答</td><td>8,421</td><td>+18.2%</td><td><span class="status status-good">健康</span></td></tr><tr class="feature-row"><td>2</td><td>报告生成</td><td>6,883</td><td>+12.5%</td><td><span class="status status-good">健康</span></td></tr><tr class="feature-row"><td>3</td><td>知识检索</td><td>4,912</td><td>-2.3%</td><td><span class="status status-warn">关注</span></td></tr></tbody></table></div></section>
</main><script src="/assets/common.js"></script><script>
const data=[['MAU','128,420','+8.4%'],['月收入','¥4,280,000','+12.1%'],['留存率','38.2%','+2.7%'],['平均会话','18m 26s','+4.8%'],['NPS 评分','72','+3.2%']];qs('#metrics').innerHTML=data.map((x,i)=>`<button class="metric ${i===0?'selected':''}"><span class="muted">${x[0]}</span><strong>${x[1]}</strong><span class="trend">↗ ${x[2]}</span></button>`).join('');qsa('.metric').forEach(x=>x.onclick=()=>{qsa('.metric').forEach(y=>y.classList.remove('selected'));x.classList.add('selected')});qsa('.filter-chip').forEach(x=>x.onclick=()=>{qsa('.filter-chip').forEach(y=>y.classList.remove('active'));x.classList.add('active');toast(`时间范围切换为 ${x.textContent}`)});qs('#toggle-table').onclick=()=>{qs('#table-wrap').classList.toggle('collapse');qs('#toggle-table').textContent=qs('#table-wrap').classList.contains('collapse')?'展开明细':'折叠明细'};qs('#compare').onclick=()=>toast('已切换昨日 / 今日对比视图');
</script></body></html>
