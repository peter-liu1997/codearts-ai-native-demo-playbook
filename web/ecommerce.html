<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI 原生电商全栈演示</title><link rel="stylesheet" href="/assets/styles.css">
<style>.shop-layout{display:grid;grid-template-columns:1fr 340px;gap:18px}.product-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.product-image{height:130px;border-radius:12px;background:linear-gradient(135deg,#e9eff8,#c8d8ee);display:grid;place-items:center;color:#5f7293;font-size:2.4rem}.cart-line{display:grid;grid-template-columns:1fr auto;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}@media(max-width:800px){.shop-layout{grid-template-columns:1fr}.product-grid{grid-template-columns:1fr}}</style></head>
<body><header class="topbar"><a class="brand" href="/"><span class="brand-mark"></span>vibe-ecommerce</a><div class="top-actions"><span>Phase 6 · 可部署全栈</span><a href="/">案例门户</a></div></header>
<main class="shell"><section class="hero" style="padding:32px"><div class="eyebrow">Prototype → Quality Gates → Full Stack</div><h1 style="font-size:2.5rem">用最小化变更跨越“70% 陷阱”</h1><p>前端、业务 API、库存原子扣减和订单确认形成完整闭环。默认使用内存数据，便于无依赖演示。</p></section>
<section class="shop-layout" style="margin-top:18px"><div><div class="section-title" style="margin:0 0 12px"><div><h2>精选商品</h2><p>实时库存来自后端 API</p></div><span class="status status-good">15 / 15 验收通过</span></div><div class="product-grid" id="products"></div></div><aside class="card"><h2>购物车</h2><div id="cart"><p class="muted">购物车为空</p></div><div class="section-title" style="margin:18px 0 12px"><strong>合计</strong><strong id="total">¥0.00</strong></div><button class="btn btn-primary" id="checkout" style="width:100%">提交订单</button><pre id="order-result" hidden></pre></aside></section></main>
<script src="/assets/common.js"></script><script>
let products=[],cart={};async function load(){products=(await api('/api/ecommerce/products')).data;renderProducts();renderCart()}function renderProducts(){qs('#products').innerHTML=products.map(p=>`<article class="card"><div class="product-image">◇</div><h3 style="margin:14px 0 6px">${escapeHtml(p.name)}</h3><p class="muted">库存 ${p.stock}</p><div class="section-title" style="margin:0"><strong>${money(p.price)}</strong><button class="btn btn-secondary" data-add="${p.id}" ${p.stock?'':'disabled'}>加入购物车</button></div></article>`).join('');qsa('[data-add]').forEach(b=>b.onclick=()=>{cart[b.dataset.add]=(cart[b.dataset.add]||0)+1;renderCart()})}function renderCart(){const rows=Object.entries(cart).filter(([,q])=>q>0);qs('#cart').innerHTML=rows.length?rows.map(([id,q])=>{const p=products.find(x=>x.id===Number(id));return`<div class="cart-line"><span>${escapeHtml(p.name)} × ${q}</span><button class="btn" data-remove="${id}">−</button></div>`}).join(''):'<p class="muted">购物车为空</p>';qsa('[data-remove]').forEach(b=>b.onclick=()=>{cart[b.dataset.remove]--;renderCart()});qs('#total').textContent=money(rows.reduce((sum,[id,q])=>sum+products.find(x=>x.id===Number(id)).price*q,0))}qs('#checkout').onclick=async()=>{const items=Object.entries(cart).filter(([,q])=>q>0).map(([productId,quantity])=>({productId:Number(productId),quantity}));if(!items.length)return toast('请先加入商品');try{const result=await api('/api/ecommerce/orders',{method:'POST',body:JSON.stringify({items})});qs('#order-result').hidden=false;qs('#order-result').textContent=JSON.stringify(result.data,null,2);cart={};await load();toast('订单已创建，库存已原子扣减')}catch(e){toast(e.message)}};load().catch(e=>toast(e.message));
</script></body></html>
