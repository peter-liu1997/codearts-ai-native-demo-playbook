<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI 编程净 ROI</title><link rel="stylesheet" href="/assets/styles.css"></head>
<body><header class="topbar"><a class="brand" href="/"><span class="brand-mark"></span>AI 编程净 ROI 测算</a><div class="top-actions"><a href="/">案例门户</a></div></header><main class="shell"><section class="hero" style="padding:34px"><div class="eyebrow">CASE 20 · Business Value</div><h1 style="font-size:2.5rem">把工程质量折算进商业回报</h1><p>NEC = 生成率 × (1 - 返工率) × (1 - 规范违反率)，再用净收益与全口径成本计算净 ROI。</p></section><section class="grid-2" style="margin-top:18px"><form class="card" id="roi-form"><h2>输入年度数据（万元）</h2><div class="form-row"><label>理论毛收益<input id="gross" type="number" value="345"></label><label>全口径总成本<input id="cost" type="number" value="278"></label></div><div class="form-row" style="margin-top:12px"><label>AI 生成率 %<input id="r-generation" type="number" value="71"></label><label>技术性返工率 %<input id="r-rework" type="number" value="29"></label></div><label style="margin-top:12px">规范违反率 %<input id="r-violation" type="number" value="19"></label><button class="btn btn-primary" style="width:100%;margin-top:16px">计算净 ROI</button></form><article class="card" id="roi-result"><p class="muted">等待计算</p></article></section><section class="card" style="margin-top:18px"><h2>改进情景模拟</h2><p class="muted">单击后将返工率降至 15%、规范违反率降至 10%，观察质量治理如何影响净效能。</p><button class="btn btn-secondary" id="improve">应用改进目标</button></section></main><script src="/assets/common.js"></script><script>async function calculate(){const result=(await api('/api/roi/calculate',{method:'POST',body:JSON.stringify({grossBenefit:Number(qs('#gross').value),totalCost:Number(qs('#cost').value),generationRate:Number(qs('#r-generation').value)/100,reworkRate:Number(qs('#r-rework').value)/100,violationRate:Number(qs('#r-violation').value)/100})})).data;const positive=result.netRoi>=0;qs('#roi-result').innerHTML=`<span class="status ${positive?'status-good':'status-bad'}">${positive?'ROI 为正':'ROI 为负'}</span><div class="stats" style="grid-template-columns:1fr 1fr;margin:18px 0"><div class="stat"><strong>${(result.nec*100).toFixed(1)}%</strong><span>净效能修正系数 NEC</span></div><div class="stat"><strong>${(result.netRoi*100).toFixed(1)}%</strong><span>净 ROI</span></div></div><h2>净收益 ${result.netBenefit.toFixed(1)} 万元</h2><p class="muted">不要用生成率单指标证明价值；应优先识别拖累 NEC 的质量项。</p>`}qs('#roi-form').onsubmit=e=>{e.preventDefault();calculate().catch(err=>toast(err.message))};qs('#improve').onclick=()=>{qs('#r-generation').value=62;qs('#r-rework').value=15;qs('#r-violation').value=10;calculate();toast('已应用质量改进目标')};calculate();</script></body></html>
