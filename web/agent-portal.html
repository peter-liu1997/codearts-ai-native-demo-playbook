<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>企业 AI 智能体门户</title><link rel="stylesheet" href="/assets/styles.css"><style>.agent-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.agent-icon{width:46px;height:46px;border-radius:13px;background:linear-gradient(135deg,#dbeafe,#c5d5ff);display:grid;place-items:center;color:#1859bd;font-weight:900}.agent-card{display:flex;flex-direction:column;gap:10px}.agent-card .form-actions{margin-top:auto}@media(max-width:820px){.agent-grid{grid-template-columns:1fr}}</style></head>
<body><header class="topbar"><a class="brand" href="/"><span class="brand-mark"></span>制造企业 AI 智能体门户</a><div class="top-actions"><button id="new">新建智能体</button><a href="/">案例门户</a></div></header>
<main class="shell"><section class="hero" style="padding:34px"><div class="eyebrow">CASE 16 · Intent-Driven Delivery</div><h1 style="font-size:2.5rem">企业 AI 能力的统一入口</h1><p>卡片 / 列表视图、能力标签筛选、草稿—发布—下线状态机，以及竞赛运营入口。</p></section>
<div class="section-title"><div><h2>智能体市场</h2><p>状态转换由后端约束，非法跳转会被显式拒绝。</p></div><div class="filters" style="margin:0"><button class="filter-chip active" data-tag="">全部</button><button class="filter-chip" data-tag="制造">制造</button><button class="filter-chip" data-tag="质量">质量</button><button class="filter-chip" data-tag="运维">运维</button></div></div><section class="agent-grid" id="agents"></section>
<section class="grid-2" style="margin-top:20px"><article class="card"><span class="status status-good">报名中</span><h2 style="margin-top:12px">2026 智能制造 Agent 创新赛</h2><p class="muted">在线提交、专家评分、实时排名。用于演示竞赛活动完整生命周期。</p><button class="btn btn-secondary" onclick="toast('已进入竞赛详情')">查看竞赛</button></article><article class="card"><h2>权限边界</h2><p class="muted">访客只读、运营可发布与下线、管理员可配置认证与竞赛。演示仓库不会连接客户真实身份系统。</p><div class="case-meta"><span class="tag">RBAC</span><span class="tag">生命周期</span><span class="tag">审计</span></div></article></section></main>
<div class="modal" id="create"><div class="modal-panel"><h2>新建智能体</h2><div class="form-row"><label>名称<input id="agent-name" value="能耗优化助手"></label><label>标签<input id="agent-tags" value="制造,节能"></label></div><label style="margin-top:12px">描述<textarea id="agent-desc" rows="4">分析产线能耗并给出优化建议</textarea></label><div class="form-actions"><button class="btn btn-primary" id="save">保存草稿</button><button class="btn" id="close">取消</button></div></div></div>
<script src="/assets/common.js"></script><script>
let tag='';async function load(){const result=await api('/api/agents'+(tag?`?tag=${encodeURIComponent(tag)}`:''));qs('#agents').innerHTML=result.data.map(a=>`<article class="card agent-card"><div class="agent-icon">AI</div><div><span class="status ${a.state==='PUBLISHED'?'status-good':a.state==='DRAFT'?'status-warn':'status-bad'}">${a.state}</span><h3 style="margin-top:10px">${escapeHtml(a.name)}</h3><p class="muted">${escapeHtml(a.description)}</p></div><div class="case-meta">${a.tags.map(t=>`<span class="tag">${escapeHtml(t)}</span>`).join('')}</div><div class="form-actions">${a.state==='DRAFT'?`<button class="btn btn-primary" data-transition="${a.id}:PUBLISHED">发布</button>`:a.state==='PUBLISHED'?`<button class="btn" data-transition="${a.id}:OFFLINE">下线</button>`:`<button class="btn btn-secondary" data-transition="${a.id}:PUBLISHED">重新发布</button>`}</div></article>`).join('');qsa('[data-transition]').forEach(b=>b.onclick=async()=>{const[id,target]=b.dataset.transition.split(':');await api(`/api/agents/${id}/transition`,{method:'POST',body:JSON.stringify({target})});toast(`状态已切换为 ${target}`);load()})}qsa('[data-tag]').forEach(b=>b.onclick=()=>{qsa('[data-tag]').forEach(x=>x.classList.remove('active'));b.classList.add('active');tag=b.dataset.tag;load()});qs('#new').onclick=()=>qs('#create').classList.add('open');qs('#close').onclick=()=>qs('#create').classList.remove('open');qs('#save').onclick=async()=>{await api('/api/agents',{method:'POST',body:JSON.stringify({name:qs('#agent-name').value,description:qs('#agent-desc').value,tags:qs('#agent-tags').value.split(',').map(x=>x.trim())})});qs('#create').classList.remove('open');toast('草稿已创建');load()};load().catch(e=>toast(e.message));
</script></body></html>
