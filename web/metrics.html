<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI 编码成熟度诊断</title><link rel="stylesheet" href="/assets/styles.css"></head>
<body><header class="topbar"><a class="brand" href="/"><span class="brand-mark"></span>AI 编码成熟度诊断</a><div class="top-actions"><a href="/">案例门户</a></div></header><main class="shell"><section class="hero" style="padding:34px"><div class="eyebrow">CASE 19 · Engineering Governance</div><h1 style="font-size:2.5rem">三个指标识别组织状态</h1><p>AI 生成代码率、技术性返工率和代码规范违反率联合判断，避免只看“生成得多”却忽视工程质量。</p></section><section class="grid-2" style="margin-top:18px"><form class="card" id="metric-form"><h2>输入度量指标</h2><label>AI 生成代码率（%）<input id="generation" type="number" min="0" max="100" value="68"></label><label style="margin-top:12px">技术性返工率（%）<input id="rework" type="number" min="0" max="100" value="31"></label><label style="margin-top:12px">代码规范违反率（%）<input id="violation" type="number" min="0" max="100" value="27"></label><button class="btn btn-primary" style="margin-top:16px;width:100%">诊断</button><p class="muted" style="margin-top:12px">预置数据来自书中工业物联网团队案例。</p></form><article class="card" id="diagnosis"><span class="status status-warn">等待诊断</span><h2 style="margin-top:14px">联合指标比单点指标更可信</h2><p class="muted">提交后将给出组织阶段、主要风险和最紧迫行动。</p></article></section><section class="card" style="margin-top:18px"><h2>四种组织状态</h2><table><thead><tr><th>状态</th><th>生成率</th><th>返工率</th><th>违反率</th><th>首要动作</th></tr></thead><tbody><tr><td>工具观望期</td><td>低</td><td>低</td><td>中</td><td>建立信任与代码库索引</td></tr><tr><td>生成膨胀期</td><td>高</td><td>高</td><td>高</td><td>重建审查质量门</td></tr><tr><td>规范内耗期</td><td>中</td><td>低</td><td>高</td><td>治理规范知识库</td></tr><tr><td>进化成熟期</td><td>高</td><td>低</td><td>低</td><td>持续监控与迭代</td></tr></tbody></table></section></main><script src="/assets/common.js"></script><script>qs('#metric-form').onsubmit=async e=>{e.preventDefault();try{const result=(await api('/api/metrics/diagnose',{method:'POST',body:JSON.stringify({generationRate:Number(qs('#generation').value)/100,reworkRate:Number(qs('#rework').value)/100,violationRate:Number(qs('#violation').value)/100})})).data;qs('#diagnosis').innerHTML=`<span class="status ${result.stage==='进化成熟期'?'status-good':'status-bad'}">${escapeHtml(result.stage)}</span><h2 style="margin-top:14px">${escapeHtml(result.risk)}</h2><p>${escapeHtml(result.action)}</p><p class="muted">建议按双周看趋势、按月联合诊断、按季度做深层归因。</p>`}catch(err){toast(err.message)}};qs('#metric-form').requestSubmit();</script></body></html>
