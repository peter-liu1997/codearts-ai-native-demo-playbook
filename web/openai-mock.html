<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OpenAI 兼容 Mock</title><link rel="stylesheet" href="/assets/styles.css"><style>.chat{min-height:360px;max-height:500px;overflow:auto;display:flex;flex-direction:column;gap:10px}.bubble{max-width:80%;padding:11px 14px;border-radius:14px;background:#edf2f8}.bubble.user{align-self:flex-end;color:#fff;background:var(--accent)}.cursor::after{content:'▍';animation:blink .7s steps(1) infinite}@keyframes blink{50%{opacity:0}}</style></head>
<body><header class="topbar"><a class="brand" href="/"><span class="brand-mark"></span>OpenAI 兼容 Mock 与 SSE</a><div class="top-actions"><a href="/">案例门户</a></div></header><main class="shell"><section class="grid-2"><article class="card"><div class="section-title" style="margin:0 0 10px"><div><h2>流式问答</h2><p>EventSource 逐字追加</p></div><span class="status status-good">CORS 已启用</span></div><div class="chat" id="chat"><div class="bubble">输入一句话，观察 SSE 流式返回。</div></div><div class="form-actions"><input id="message" value="你好，演示码道如何快速联调"><button class="btn btn-primary" id="send-stream">发送</button></div></article><article class="card"><h2>Tool Calling 闭环</h2><p class="muted">第一次响应要求调用工具；本地执行后把 tool 消息回传，第二次得到自然语言结果。</p><button class="btn btn-secondary" id="run-tool">运行两阶段调用</button><pre id="tool-result">等待执行</pre></article></section></main><script src="/assets/common.js"></script><script>
qs('#send-stream').onclick=()=>{const text=qs('#message').value.trim();if(!text)return;qs('#chat').insertAdjacentHTML('beforeend',`<div class="bubble user">${escapeHtml(text)}</div>`);const ai=document.createElement('div');ai.className='bubble cursor';qs('#chat').appendChild(ai);const source=new EventSource(`/api/chat/stream?message=${encodeURIComponent(text)}`);source.onmessage=e=>{ai.textContent+=JSON.parse(e.data).delta;qs('#chat').scrollTop=qs('#chat').scrollHeight};source.addEventListener('done',()=>{ai.classList.remove('cursor');source.close()});source.onerror=()=>{ai.classList.remove('cursor');source.close()}};
qs('#run-tool').onclick=async()=>{try{const first=await api('/v1/chat/completions',{method:'POST',body:JSON.stringify({model:'codearts-local-mock',messages:[{role:'user',content:'深圳天气如何？'}],tools:[{type:'function',function:{name:'get_weather',description:'查询天气',parameters:{type:'object',properties:{city:{type:'string'}}}}}]})});const call=first.choices[0].message.tool_calls[0];const second=await api('/v1/chat/completions',{method:'POST',body:JSON.stringify({model:'codearts-local-mock',messages:[{role:'user',content:'深圳天气如何？'},first.choices[0].message,{role:'tool',tool_call_id:call.id,content:'晴，31℃'}],tools:[{type:'function',function:{name:'get_weather'}}]})});qs('#tool-result').textContent=JSON.stringify({firstFinish:first.choices[0].finish_reason,toolCall:call,secondFinish:second.choices[0].finish_reason,answer:second.choices[0].message.content},null,2)}catch(e){toast(e.message)}};
</script></body></html>
